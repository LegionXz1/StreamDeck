<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamerDeck — OBS Dock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* OBS Compact Dock — minimalist theme */
    body {
      background-color: var(--surface-canvas);
      margin: 0; padding: 0;
      overflow-x: hidden;
      font-size: 13px;
      font-family: var(--font-body);
    }
    .obs-dock-viewport {
      display: flex; flex-direction: column;
      height: 100vh; width: 100%;
      box-sizing: border-box;
      background: var(--surface-canvas);
    }
    .dock-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface-base);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .dock-brand { display: flex; align-items: center; gap: 6px; }
    .dock-logo { color: var(--purple-brand); }
    .dock-title {
      font-family: var(--font-display); font-weight: 700; font-size: 0.82rem;
      color: var(--text-primary); letter-spacing: -0.02em;
    }
    .dock-channel-pill {
      font-family: var(--font-mono); font-size: 0.62rem; font-weight: 600;
      color: var(--text-muted);
      border: 1px solid var(--border-default);
      padding: 2px 6px; border-radius: var(--radius-xs);
    }
    .dock-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted);
    }
    .dock-status-dot.live {
      background: var(--emerald-live);
      animation: dockLivePulse 2.5s ease infinite;
    }
    @keyframes dockLivePulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.35; }
    }
    .dock-nav {
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--surface-base);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0; gap: 0; flex-shrink: 0;
    }
    .dock-tab-btn {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-body); font-weight: 600; font-size: 0.72rem;
      padding: 7px 4px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      transition: var(--transition-fast);
    }
    .dock-tab-btn:hover { color: var(--text-secondary); }
    .dock-tab-btn.active { border-bottom-color: var(--purple-brand); color: var(--text-primary); }
    .dock-content {
      flex: 1; overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dock-panel { display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .dock-panel.hidden { display: none !important; }
    .dock-clip-hero {
      background: var(--surface-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; color: var(--text-primary);
      font-weight: 600; font-size: 0.78rem;
      transition: var(--transition-fast);
    }
    .dock-clip-hero:hover { border-color: var(--border-strong); background: var(--surface-hover); }
    .dock-clip-hero:active { opacity: 0.7; }
    .dock-chatter-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface-card); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm); padding: 6px 8px; gap: 8px;
      transition: var(--transition-fast);
    }
    .dock-chatter-row:hover { border-color: var(--border-default); }
    .dock-chatter-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .dock-avatar-disc {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--surface-elevated);
      border: 1.5px solid var(--border-default);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: var(--text-primary); flex-shrink: 0;
    }
    .dock-chatter-meta { display: flex; flex-direction: column; min-width: 0; }
    .dock-chatter-name {
      font-weight: 600; font-size: 0.78rem; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dock-chatter-msg {
      font-size: 0.65rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-dock-so {
      background: var(--purple-brand); border: none; color: var(--text-pure);
      font-family: var(--font-body); font-weight: 600; font-size: 0.68rem;
      padding: 3px 8px; border-radius: var(--radius-xs);
      cursor: pointer; display: flex; align-items: center; gap: 3px;
      flex-shrink: 0; transition: var(--transition-fast);
    }
    .btn-dock-so:hover { background: var(--purple-hover); }
    .btn-dock-so:active { opacity: 0.8; }
    .btn-dock-so:disabled { background: var(--surface-elevated); color: var(--text-muted); cursor: not-allowed; }
    .dock-cooldown-bar {
      background: var(--tint-amber-soft); border: 1px solid var(--amber-glow);
      padding: 4px 8px; border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.68rem; color: var(--amber-signal);
      font-family: var(--font-mono); font-weight: 600;
    }
    .dock-macros-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .dock-macro-btn {
      background: var(--surface-card); border: 1px solid var(--border-subtle);
      padding: 8px 10px; border-radius: var(--radius-sm);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: flex-start; text-align: left; transition: var(--transition-fast);
    }
    .dock-macro-btn:hover { background: var(--surface-elevated); border-color: var(--border-default); }
    .dock-macro-cmd { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; color: var(--text-primary); }
    .dock-macro-lbl { font-size: 0.62rem; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .dock-safety-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .dock-safety-btn {
      background: var(--surface-card); border: 1px solid var(--border-subtle);
      padding: 8px 10px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: var(--transition-fast);
    }
    .dock-safety-btn:hover { border-color: var(--border-default); }
    .dock-safety-btn.active { background: var(--tint-purple-soft); border-color: var(--purple-brand); }
    .dock-safety-btn.active .dock-mode-state { color: var(--purple-light); background: var(--tint-purple-mid); }
    .dock-safety-label { font-weight: 600; font-size: 0.72rem; color: var(--text-secondary); }
    .dock-mode-state {
      font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700;
      color: var(--text-muted); background: var(--surface-canvas);
      padding: 2px 5px; border-radius: var(--radius-xs);
    }
    .dock-section-label {
      font-size: 0.62rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px;
    }
    #dockClearChatBtn {
      background: var(--tint-crimson-soft); border: 1px solid var(--crimson-glow);
      color: var(--crimson-alert); padding: 8px; border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.72rem; cursor: pointer; margin-top: 4px;
      transition: var(--transition-fast); font-family: var(--font-body); width: 100%;
    }
    #dockClearChatBtn:hover { border-color: var(--crimson-alert); }
    #dockManualInput {
      flex: 1; background: var(--surface-card); border: 1px solid var(--border-default);
      border-radius: var(--radius-xs); color: var(--text-primary);
      padding: 5px 8px; font-size: 0.72rem; outline: none;
      font-family: var(--font-body); transition: var(--transition-fast);
    }
    #dockManualInput:focus { border-color: var(--border-strong); }
    #dockManualInput::placeholder { color: var(--text-muted); }
    #dockManualBtn {
      background: var(--purple-brand); border: none; color: var(--text-pure);
      font-weight: 600; font-size: 0.72rem; padding: 5px 10px;
      border-radius: var(--radius-xs); cursor: pointer;
      font-family: var(--font-body); transition: var(--transition-fast);
    }
    #dockManualBtn:hover { background: var(--purple-hover); }
  </style>
</head>
<body>
  <div class="obs-dock-viewport">

    <header class="dock-header">
      <div class="dock-brand">
        <svg class="dock-logo" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
        </svg>
        <span class="dock-title">StreamerDeck</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="dock-status-dot" id="dockStatusDot"></span>
        <span class="dock-channel-pill" id="dockChannelPill">#channel</span>
      </div>
    </header>

    <div class="dock-cooldown-bar hidden" id="dockCooldownBar">
      <span>⚡ Shoutout Cooldown:</span>
      <span id="dockCooldownTime">120s</span>
    </div>

    <nav class="dock-nav">
      <button class="dock-tab-btn active" data-tab="shoutouts" id="tabShoutouts">Shoutouts</button>
      <button class="dock-tab-btn" data-tab="macros" id="tabMacros">Macros</button>
      <button class="dock-tab-btn" data-tab="deck" id="tabDeck">Controls</button>
    </nav>

    <main class="dock-content">

      <section class="dock-panel" id="panelShoutouts">
        <div style="display: flex; gap: 4px;">
          <input type="text" id="dockManualInput" placeholder="Shoutout: @username">
          <button id="dockManualBtn">SO</button>
        </div>
        <div id="dockChattersList" style="display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1;">
          <div style="padding: 20px 10px; text-align: center; color: var(--text-muted); font-size: 0.72rem;">
            Waiting for viewers to join chat...
          </div>
        </div>
      </section>

      <section class="dock-panel hidden" id="panelMacros">
        <div class="dock-macros-grid" id="dockMacrosGrid"></div>
      </section>

      <section class="dock-panel hidden" id="panelDeck">
        <div class="dock-clip-hero" id="dockClipBtn">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--crimson-alert); display: inline-block; flex-shrink: 0;"></span>
            <span>CLIP LAST 30 SECONDS</span>
          </div>
          <span style="font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-muted);">Alt+C</span>
        </div>

        <div class="dock-section-label">Chat Safety Modes</div>
        <div class="dock-safety-grid">
          <button class="dock-safety-btn" data-mode="emote" id="dockBtnEmote">
            <span class="dock-safety-label">Emote Only</span>
            <span class="dock-mode-state" id="dockStateEmote">OFF</span>
          </button>
          <button class="dock-safety-btn" data-mode="sub" id="dockBtnSub">
            <span class="dock-safety-label">Sub Only</span>
            <span class="dock-mode-state" id="dockStateSub">OFF</span>
          </button>
          <button class="dock-safety-btn" data-mode="followers" id="dockBtnFollowers">
            <span class="dock-safety-label">Followers</span>
            <span class="dock-mode-state" id="dockStateFollowers">OFF</span>
          </button>
          <button class="dock-safety-btn" data-mode="slow" id="dockBtnSlow">
            <span class="dock-safety-label">Slow (5s)</span>
            <span class="dock-mode-state" id="dockStateSlow">OFF</span>
          </button>
        </div>

        <button id="dockClearChatBtn">🧹 Clear / Nuke Live Chat</button>
      </section>

    </main>

    <div class="toast-stack" id="toastStack"></div>
  </div>

  <!-- Token bootstrap: must run BEFORE app.js -->
  <!-- Reads auth credentials from URL hash (#t=TOKEN&c=CLIENTID&ch=CHANNEL) -->
  <!-- This is how OBS dock auto-logs in without manual OAuth flow -->
  <script>
    (function() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;
      const params = new URLSearchParams(hash);
      const token    = params.get('t');
      const clientId = params.get('c');
      const channel  = params.get('ch');
      if (token) {
        localStorage.setItem('sp_twitch_token',    token);
        if (clientId) localStorage.setItem('sp_twitch_client_id', clientId);
        if (channel)  localStorage.setItem('sp_twitch_channel',   channel);
        // Do NOT use history.replaceState to clear the hash.
        // We want OBS to save the URL *with* the token so it persists across restarts.
      }
    })();
  </script>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // Tab routing
      const tabs = document.querySelectorAll('.dock-tab-btn');
      const panels = {
        shoutouts: document.getElementById('panelShoutouts'),
        macros:    document.getElementById('panelMacros'),
        deck:      document.getElementById('panelDeck')
      };
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const target = tab.getAttribute('data-tab');
          Object.keys(panels).forEach(k => {
            if (panels[k]) panels[k].classList.toggle('hidden', k !== target);
          });
        });
      });

      // Init macros (guard: function may not be defined if user not authenticated)
      if (typeof renderChatMacros === 'function') renderChatMacros();

      // Render dock chatters — wraps refreshChattersDeck from app.js
      const origRefresh = typeof refreshChattersDeck !== 'undefined' ? refreshChattersDeck : null;
      refreshChattersDeck = function() {
        if (origRefresh) origRefresh();
        const listEl = document.getElementById('dockChattersList');
        if (!listEl) return;
        const list = Array.from(APP_STATE.chatters.values()).sort((a, b) => b.lastSeen - a.lastSeen);
        if (list.length === 0) {
          listEl.innerHTML = `<div style="padding:20px 10px;text-align:center;color:var(--text-muted);font-size:0.72rem;">Waiting for viewers on #${APP_STATE.auth.channel}...</div>`;
          return;
        }
        listEl.innerHTML = '';
        const now = Date.now();
        const isGlobalCooldown = APP_STATE.cooldowns.globalExpiresAt > now;
        list.forEach(c => {
          const isUserCooldown = APP_STATE.cooldowns.userCooldowns[c.username] && APP_STATE.cooldowns.userCooldowns[c.username] > now;
          const initial = (c.displayName || c.username).charAt(0).toUpperCase();
          const nameColor = c.color && c.color !== '#000000' ? c.color : 'var(--text-primary)';
          const row = document.createElement('div');
          row.className = 'dock-chatter-row';
          row.innerHTML = `
            <div class="dock-chatter-left">
              <div class="dock-avatar-disc" style="border-color:${nameColor};">${initial}</div>
              <div class="dock-chatter-meta">
                <span class="dock-chatter-name" style="color:${nameColor};">${c.displayName}</span>
                <span class="dock-chatter-msg">${escapeText(c.lastMessage)}</span>
              </div>
            </div>
            <div>${isUserCooldown
              ? `<span style="font-size:0.62rem;color:var(--amber-signal);font-family:var(--font-mono);">cd</span>`
              : `<button class="btn-dock-so" ${isGlobalCooldown ? 'disabled' : ''}>SO</button>`
            }</div>`;
          row.querySelector('.btn-dock-so')?.addEventListener('click', () => sendTwitchShoutout(c.username, null, c.lastGame));
          listEl.appendChild(row);
        });
      };

      // Manual shoutout
      const manInput = document.getElementById('dockManualInput');
      const manBtn   = document.getElementById('dockManualBtn');
      const doManualSO = () => {
        const u = manInput.value.trim().replace(/^@/, '');
        if (u) { sendTwitchShoutout(u); manInput.value = ''; }
      };
      manBtn?.addEventListener('click', doManualSO);
      manInput?.addEventListener('keydown', e => { if (e.key === 'Enter') doManualSO(); });

      // Clip button
      document.getElementById('dockClipBtn')?.addEventListener('click', triggerLiveClip);

      // Safety modes
      ['emote', 'sub', 'followers', 'slow'].forEach(k => {
        const btn = document.querySelector(`.dock-safety-btn[data-mode="${k}"]`);
        if (!btn) return;
        const sync = () => {
          btn.classList.toggle('active', APP_STATE.modes[k]);
          const lbl = btn.querySelector('.dock-mode-state');
          if (lbl) lbl.textContent = APP_STATE.modes[k] ? 'ON' : 'OFF';
        };
        btn.addEventListener('click', () => { toggleChatSafetyMode(k); sync(); });
        sync();
      });

      // Nuke chat
      document.getElementById('dockClearChatBtn')?.addEventListener('click', nukeLiveChat);

      // Channel pill + live dot
      const chPill = document.getElementById('dockChannelPill');
      if (chPill) chPill.textContent = `#${APP_STATE.auth.channel || 'channel'}`;
      const dot = document.getElementById('dockStatusDot');
      if (dot && APP_STATE.stream?.isLive) dot.classList.add('live');
    });
  </script>
</body>
</html>
